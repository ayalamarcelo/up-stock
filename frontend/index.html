<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpStock Admin - MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="global.css">
</head>

<body class="bg-gray-100 font-sans antialiased">

    <div class="max-w-4xl mx-auto p-6">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">UpStock 📦</h1>
            <p class="text-gray-600 mt-2">Panel de Control Rápido para la Entrega</p>
        </header>

        <div class="bg-white shadow-md rounded-xl p-6 border border-gray-200">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2">Registrar Nuevo Alquiler</h2>

            <form id="form-alquiler" class="space-y-6">

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Seleccionar Cliente</label>
                    <select id="select-clientes" required
                        class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Cargando clientes...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Fecha de Devolución Esperada</label>
                    <input type="datetime-local" id="fecha-esperada" required
                        class="w-full bg-gray-50 border border-gray-300 text-gray-900 rounded-lg p-2.5 focus:ring-blue-500 focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Seleccionar Activos a Llevar</label>
                    <p class="text-xs text-gray-500 mb-3">Puedes marcar todos los que el cliente necesite alquilar.</p>

                    <div id="contenedor-activos"
                        class="max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-4 bg-gray-50 space-y-3">
                        <p class="text-gray-500 text-sm">Cargando activos disponibles...</p>
                    </div>
                </div>

                <button type="submit"
                    class="w-full text-white bg-blue-600 hover:bg-blue-700 font-medium rounded-lg text-sm px-5 py-3 text-center transition duration-200 shadow-sm">
                    Guardar Alquiler
                </button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
